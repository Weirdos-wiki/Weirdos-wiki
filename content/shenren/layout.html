<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111111'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{REL}}assets/style.css">
  <style>
    .card{
      max-width: 800px;
        margin: 0 auto;
        color:#666;
        align-content: center;
        font-family:'Times New Roman', Times, serif;
        font-size: 30px;
        background-color: aquamarine;
        border-radius: 0.5em;
        border-color: blueviolet;
        border-style: inset;
        border-width: 0.2em;
        padding: 2em;
        line-height: 0.3;
        box-shadow: 0.2em 0.2em 0.1em 0.1em;
    }
  </style>
</head>
<body class="card">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="{{REL}}index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>{{SITE_NAME}}</span>
      </a>
      <nav class="topnav" aria-label="主导航">
        <a href="{{REL}}index.html">首页</a>
        <a href="{{REL}}index.html#index">页面索引</a>
        <a class="topnav-repo" href="{{REPO_URL}}" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  {{CONTENT}}
  <footer class="site-footer">
    <div class="shell footer-inner">
      <p><strong>{{SITE_NAME}}</strong></p>
      <a href="{{REL}}index.html#index">页面索引 ↑</a>
    </div>
  </footer>
</body>
</html>
